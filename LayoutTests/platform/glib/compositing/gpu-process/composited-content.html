<!DOCTYPE html><!-- webkit-test-runner [ UseGPUProcessForDOMRenderingEnabled=true UseGPUProcessForWebGLEnabled=true ] -->
<!-- The reference draws the same content in the web process. -->
<style>
.box {
    display: inline-block;
    width: 100px;
    height: 100px;
    margin: 5px;
    vertical-align: top;
}
</style>
<div class="box" style="background: linear-gradient(red, blue)"></div>
<div class="box" style="background-color: green; transform: rotate(10deg); will-change: transform"></div>
<div class="box" style="background-color: blue; opacity: 0.5; will-change: opacity"></div>
<div class="box" style="background-color: orange; filter: blur(4px)"></div>
<div class="box" style="background-color: purple; border-radius: 30px; box-shadow: 5px 5px 5px gray"></div>
<svg class="box" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="teal" stroke="black" stroke-width="4"/></svg>
<canvas class="box" id="canvas" width="100" height="100"></canvas>
<canvas class="box" id="webgl" width="100" height="100"></canvas>
<script>
const context = document.getElementById("canvas").getContext("2d");
context.fillStyle = "yellow";
context.fillRect(0, 0, 100, 100);
context.fillStyle = "black";
context.fillRect(25, 25, 50, 50);

const gl = document.getElementById("webgl").getContext("webgl", { preserveDrawingBuffer: true });
gl.enable(gl.SCISSOR_TEST);
gl.clearColor(0, 0, 1, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.scissor(25, 25, 50, 50);
gl.clearColor(1, 0, 0, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
</script>
