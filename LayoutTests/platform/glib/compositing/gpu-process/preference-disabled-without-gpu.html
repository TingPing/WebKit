<!DOCTYPE html><!-- webkit-test-runner [ UseGPUProcessForDOMRenderingEnabled=false ] -->
<!-- A web process without the GPU renders pages that disable GPU-process rendering in the GPU process. -->
<style>
.box {
    display: inline-block;
    width: 100px;
    height: 100px;
}
#composited {
    background-color: green;
    will-change: transform;
}
</style>
<div id="composited" class="box"></div>
<canvas id="canvas" class="box" width="100" height="100"></canvas>
<canvas id="webgl" class="box" width="100" height="100"></canvas>
<script>
const context = document.getElementById("canvas").getContext("2d");
context.fillStyle = "green";
context.fillRect(0, 0, 100, 100);

const gl = document.getElementById("webgl").getContext("webgl", { preserveDrawingBuffer: true });
gl.clearColor(0, 128 / 255, 0, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
</script>
