<!DOCTYPE html><!-- webkit-test-runner [ UseGPUProcessForDOMRenderingEnabled=true UseGPUProcessForWebGLEnabled=true ] -->
<style>
div {
    width: 200px;
    height: 100px;
    margin: 10px;
    font-family: Ahem;
    font-size: 20px;
    color: blue;
}
#tiles {
    background-color: green;
}
#layer {
    background-color: orange;
    will-change: transform;
}
</style>
<div id="tiles">XXX</div>
<div id="layer">XXX</div>
<script>
// The page is painted again after the GPU process crashes and is relaunched.
if (window.testRunner) {
    testRunner.waitUntilDone();
    window.addEventListener("load", () => {
        requestAnimationFrame(() => {
            testRunner.terminateGPUProcess();
            setTimeout(() => {
                requestAnimationFrame(() => requestAnimationFrame(() => testRunner.notifyDone()));
            }, 500);
        });
    });
}
</script>
